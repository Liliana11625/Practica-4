<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página Educativa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    nav {
      background-color: #388e66;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1588072432836-e10032774350?fit=crop&w=1400&q=80');
      background-size: cover;
      background-position: center;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;
      background-blend-mode: overlay;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.3rem;
      max-width: 800px;
    }

    footer {
      background-color: #2E7D32;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portal Educativo</h1>
  </header>

  <nav>
    <a href="#">Acerca de</a>
    <a href="#">Galería de Imágenes</a>
    <a href="#">Contacto</a>
  </nav>

  <section class="hero">
    <div>
      <h1>Aprender es crecer</h1>
      <p>Bienvenido al portal educativo donde el conocimiento es la herramienta más poderosa. Explora, aprende y transforma tu futuro.</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Portal Educativo. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
