<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    background-color: #e6f5ec;
    margin: 0;
    padding: 0;
  }

  header {
    background-color: #2e8b57;
    color: white;
    padding: 20px 0;
    text-align: center;
  }

  main {
    max-width: 800px;
    background-color: white;
    margin: 40px auto;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  footer {
    background-color: #f0f0f0;
    color: #666;
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    position: fixed;
    bottom: 0;
    width: 100%;
  }

  h1 {
    color: #2e8b57;
  }

  .gallery img {
    width: 100%;
    max-width: 300px;
    margin: 10px;
    border-radius: 5px;
    box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
  }

  form label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
  }

  form input, form textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  form button {
    background-color: #2e8b57;
    color: white;
    border: none;
    padding: 10px 20px;
    margin-top: 15px;
    border-radius: 5px;
    cursor: pointer;
  }

  a {
    color: #2e8b57;
    text-decoration: none;
    display: inline-block;
    margin-top: 20px;
  }
</style>

</head>
<body>
  <header>
    <h1>Contacto</h1>
    <p>Estamos aquí para ayudarte. ¡Escríbenos!</p>
  </header>

  <main>
    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <a href="index.html">← Volver al inicio</a>
  </main>

  <footer>
    © 2025 Plataforma Educativa | Todos los derechos reservados
  </footer>
</body>
</html>
